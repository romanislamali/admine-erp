# Standalone Nginx configuration for Host OS installation (/etc/nginx/sites-available/erp.adminead.com)
#
# Usage:
# 1. sudo cp nginx/erp.adminead.com.conf /etc/nginx/sites-available/erp.adminead.com
# 2. sudo ln -s /etc/nginx/sites-available/erp.adminead.com /etc/nginx/sites-enabled/
# 3. sudo certbot --nginx -d erp.adminead.com

upstream erp_backend {
    server 127.0.0.1:3001;
}

upstream erp_frontend {
    server 127.0.0.1:5180;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.adminead.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Proxy
    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://erp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
