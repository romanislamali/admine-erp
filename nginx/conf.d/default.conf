upstream backend_app {
    server backend:3000;
}

upstream frontend_app {
    server frontend:80;
}

# ==========================================
# 1. HTTP Configuration (Port 80)
# ==========================================

# ERP Subdomain (HTTP -> redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name eoffice.adminead.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main Website - Apex & WWW (HTTP -> redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name adminead.com www.adminead.com localhost _;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. HTTPS Configuration
# ==========================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eoffice.adminead.com;

    ssl_certificate /etc/letsencrypt/live/eoffice.adminead.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eoffice.adminead.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Allow Let's Encrypt ACME challenges (in case Cloudflare redirects http->https)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Requests
    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Requests
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminead.com www.adminead.com;

    ssl_certificate /etc/letsencrypt/live/adminead.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminead.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Allow Let's Encrypt ACME challenges (in case Cloudflare redirects http->https)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static marketing site
    root /usr/share/nginx/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}