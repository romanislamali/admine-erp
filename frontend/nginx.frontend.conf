server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache hashed static assets aggressively; index.html is never cached so deploys take effect immediately
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router client-side routing: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
