services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-erp_db}
    ports:
      - "${DB_PORT_EXPOSED:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - erp_network

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT_EXPOSED:-3001}:${PORT:-3000}"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-erp_db}
      DB_PORT: ${DB_PORT:-5432}
      PORT: ${PORT:-3000}
      ALERT_EMAIL: ${ALERT_EMAIL}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    volumes:
      - ./backend:/app
      - /app/node_modules
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - erp_network
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT_EXPOSED:-5180}:${FRONTEND_PORT_EXPOSED:-5180}"
    environment:
      VITE_PORT: ${FRONTEND_PORT_EXPOSED:-5180}
      VITE_API_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - erp_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    networks:
      - erp_network
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - erp_network
    depends_on:
      - nginx

volumes:
  pgdata:

networks:
  erp_network:
    driver: bridge